# project.yml — the Xcode project, as text.
#
# The .xcodeproj beside this file is GENERATED from it with XcodeGen
# (`brew install xcodegen && xcodegen generate` in this directory) and is
# committed so that the app opens in Xcode with nothing installed first.
# Edit this file, not the project; a change here without regenerating is a
# change nobody builds. CI regenerates it before building.

name: Xueni

options:
  bundleIdPrefix: xyz.xueni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

packages:
  XueniKit:
    path: XueniKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Xueni:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Xueni
        excludes:
          - "Info.plist"
    dependencies:
      - package: XueniKit
        product: XueniKit
    info:
      path: Xueni/Info.plist
      properties:
        CFBundleDisplayName: Xueni
        CFBundleName: Xueni
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # A reader's own node may well be plain http on a local network
        # (`http://192.168.1.10:8545`), and the endpoint list is theirs to
        # set; the defaults are all https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.xueni.ios
        PRODUCT_NAME: Xueni
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

schemes:
  Xueni:
    build:
      targets:
        Xueni: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
